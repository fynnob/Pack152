<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 1: Passkey — Pack 152 Onboarding</title>

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================================================
       1. PACK 152 DESIGN TOKENS & DARK THEME
       ========================================================================== */
    :root {
      --color-primary: #16a34a;         /* Scout Green */
      --color-primary-hover: #15803d;
      --color-secondary: #2563eb;       /* Cub Scout Blue */
      --color-danger: #ef4444;          /* Red */
      --color-success: #22c55e;         /* Green */

      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;

      --radius-md: 0.625rem;
      --radius-lg: 1rem;
      --radius-full: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      min-height: 100vh;
      font-family: var(--font-sans);
      color: #ffffff;
      background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                  url('https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?auto=format&fit=crop&w=1920&q=80') 
                  center/cover no-repeat fixed;
    }

    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15vh 1.5rem 3rem 1.5rem;
    }

    /* Card Layout */
    .auth-card {
      background: rgba(30, 41, 59, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 2.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .step-tag {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      background-color: rgba(22, 163, 74, 0.2);
      border: 1px solid var(--color-primary);
      color: #4ade80;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
    }

    .card-header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .card-header p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    /* Key Icon Graphic */
    .icon-badge {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem auto;
      background: rgba(22, 163, 74, 0.15);
      border: 2px solid var(--color-primary);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      box-shadow: 0 0 25px rgba(22, 163, 74, 0.25);
    }

    /* Alert Banner */
    .alert-banner {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      line-height: 1.4;
      text-align: left;
    }
    .alert-banner.error { display: block; background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--color-danger); color: #fca5a5; }
    .alert-banner.info { display: block; background-color: rgba(37, 99, 235, 0.2); border: 1px solid var(--color-secondary); color: #93c5fd; }
    .alert-banner.success { display: block; background-color: rgba(34, 197, 94, 0.2); border: 1px solid var(--color-success); color: #86efac; }

    /* Buttons */
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--color-primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
  <link rel="stylesheet" href="/shared.css?v=3">
</head>
<body>

  <main class="page-wrapper">
    <div class="auth-card">
      
      <span class="step-tag">Step 1 of 2</span>
      
      <div class="icon-badge">🔑</div>

      <div class="card-header">
        <h1>Create a Passkey</h1>
        <p>Sign in instantly without passwords using Face ID, Touch ID, or your device PIN.</p>
      </div>

      <!-- Alert Banner -->
      <div id="alert-banner" class="alert-banner"></div>

      <!-- Action Buttons -->
      <div class="btn-stack">
        <button type="button" id="create-passkey-btn" class="btn btn-primary" onclick="createPasskey()">
          🛡️ Create Passkey
        </button>
        <button type="button" class="btn btn-secondary" onclick="skipStep()">
          Skip for Now
        </button>
      </div>

    </div>
  </main>

  <script>
    /* ==========================================================================
       SUPABASE CLIENT SETUP (WITH EXPERIMENTAL PASSKEY OPTION)
       ========================================================================== */
    const SUPABASE_URL = 'https://ygoxjtgoyoxjcvtypoii.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yfKBDqPQsdXY2dNhkuUPRw_7pea76ia';

    var supabaseClient = null;
    try {
      if (window.supabase && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            experimental: {
              passkey: true
            }
          }
        });
      }
    } catch (err) {
      console.warn('Supabase initialization warning:', err);
    }

    /* ==========================================================================
       PASSKEY CREATION FUNCTION
       ========================================================================== */
    async function createPasskey() {
      clearAlert();

      // Check browser WebAuthn support
      if (!window.PublicKeyCredential) {
        showAlert('Passkeys are not supported by your current browser. Redirecting...', 'info');
        setTimeout(skipStep, 1500);
        return;
      }

      const btn = document.getElementById('create-passkey-btn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Prompting Biometrics...';
      }

      try {
        if (!supabaseClient) throw new Error('Supabase client failed to initialize.');

        // Trigger WebAuthn Passkey Registration Ceremony
        if (supabaseClient.auth && typeof supabaseClient.auth.registerPasskey === 'function') {
          const { data, error } = await supabaseClient.auth.registerPasskey();
          if (error) throw error;
        } else {
          throw new Error('Passkeys are disabled or not available in this SDK build.');
        }

        showAlert('✔ Passkey created successfully! Redirecting...', 'success');
        setTimeout(skipStep, 1000);

      } catch (err) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '🛡️ Create Passkey';
        }

        if (err.name === 'NotAllowedError' || (err.message && err.message.includes('cancel'))) {
          showAlert('Passkey creation was cancelled. You can try again or click Skip.', 'info');
        } else {
          showAlert(err.message || 'Passkey setup failed. You can skip this step.', 'error');
        }
      }
    }

    /* ==========================================================================
       REDIRECT TO STEP 2 (PROFILE SETUP)
       ========================================================================== */
    function skipStep() {
      window.location.href = '/onBoarding/profile.html';
    }

    function showAlert(msg, type) {
      const alert = document.getElementById('alert-banner');
      if (alert) {
        alert.textContent = msg;
        alert.className = `alert-banner ${type}`;
      }
    }

    function clearAlert() {
      const alert = document.getElementById('alert-banner');
      if (alert) {
        alert.className = 'alert-banner';
        alert.textContent = '';
      }
    }
  </script>

</body>
</html>
