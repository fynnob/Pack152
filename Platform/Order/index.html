<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pack Gear & Orders — Pack 152</title>

  <!-- External SDKs & Auth Guard -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth-guard.js"></script>

  <!-- Page Styles -->
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/shared.css?v=5">
</head>
<body class="platform-order-page">

  <header class="navbar">
    <h1>Pack 152 — Gear & Orders</h1>
    <div class="nav-actions">
      <div class="deadline-badge">
        <span>⏰ Order Window Closes:</span>
        <strong id="closing-date">Oct 15, 2026</strong>
      </div>
      <button class="cart-trigger" type="button" onclick="window.openCartModal()" aria-label="Open cart">
        <span class="cart-icon">🛒</span><span id="cart-count" class="cart-count">0</span>
      </button>
      <a href="/Platform/" class="btn-nav">← Back to Hub</a>
    </div>
  </header>

  <main class="container">
    <!-- Active Order Banner -->
    <div id="order-banner" class="order-summary-banner" style="display: none;">
      <div>
        <h3 style="font-size: 1.1rem; font-weight: 800; color: #60a5fa;">Active Order Placed</h3>
        <p id="order-banner-details" style="font-size: 0.875rem; color: #cbd5e1; margin-top: 0.25rem;"></p>
      </div>
      <div class="banner-actions">
        <button class="btn-edit" onclick="window.enableEditOrder()">✏️ Change Order</button>
        <button class="btn-delete" onclick="window.confirmDeleteOrder()">🗑️ Delete Order</button>
      </div>
    </div>

    <!-- Catalog Sections -->
    <div id="catalog-container">
      <div style="color: #94a3b8;">Loading catalog & live exchange rates...</div>
    </div>

    <!-- Shopping Cart Panel -->
    <div class="cart-card">
      <h3>Your Order Cart</h3>
      <div id="cart-items">
        <p style="font-size: 0.875rem; color: #94a3b8;">Your cart is empty.</p>
      </div>
      <div class="cart-total">
        <div style="display:flex; justify-content:space-between;">
          <span>Total USD:</span>
          <span id="cart-total-usd" style="color: #4ade80;">$0.00</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size: 0.875rem; color: #94a3b8;">
          <span>Total EUR (Est.):</span>
          <span id="cart-total-eur">€0.00</span>
        </div>
      </div>
      <button id="place-order-btn" class="btn-order" onclick="window.submitOrder()" disabled>Place Order</button>
    </div>
  </main>

  <div id="item-detail-modal" class="modal-overlay item-detail-modal">
    <div class="modal-card item-detail-card">
      <button class="item-detail-close" type="button" onclick="window.closeItemDetails()" aria-label="Close item details">×</button>
      <img id="item-detail-image" class="item-detail-image" alt="" />
      <div class="item-detail-content">
        <span id="item-detail-den" class="item-detail-den"></span>
        <h2 id="item-detail-title"></h2>
        <p id="item-detail-description"></p>
        <div class="item-detail-meta">
          <strong id="item-detail-price"></strong>
          <span id="item-detail-sku" class="badge-sku"></span>
        </div>
        <div id="item-detail-sizes" class="item-detail-sizes"></div>
      </div>
    </div>
  </div>

  <div id="cart-modal" class="modal-overlay cart-modal">
    <div class="modal-card cart-modal-card">
      <button class="item-detail-close" type="button" onclick="window.closeCartModal()" aria-label="Close cart">×</button>
      <h2>Your Order Cart</h2>
      <div id="cart-modal-items" class="cart-modal-items"></div>
      <button class="btn-order cart-modal-order" type="button" onclick="window.closeCartModal(); document.getElementById('place-order-btn').scrollIntoView({ behavior: 'smooth', block: 'center' });">Go to Place Order</button>
    </div>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="custom-modal" class="modal-overlay">
    <div class="modal-card">
      <div id="modal-title" class="modal-title">Confirm Action</div>
      <div id="modal-body" class="modal-body">Are you sure?</div>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="modal-btn" style="background: rgba(255,255,255,0.1); color: #fff;">Cancel</button>
        <button id="modal-confirm-btn" class="modal-btn" style="background: var(--color-danger); color: #fff;">Delete Order</button>
      </div>
    </div>
  </div>

  <!-- Toast Notifications Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modular Scripts loaded in strict dependency order -->
  <script src="./exchange.js"></script>
  <script src="./ui.js"></script>
  <script src="./cart.js"></script>
</body>
</html>
