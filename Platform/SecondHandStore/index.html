<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Second-Hand Store — Pack 152</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth-guard.js"></script>
  <link rel="stylesheet" href="../Order/styles.css">
  <link rel="stylesheet" href="/shared.css?v=14">
</head>
<body class="secondhand-page">
  <header class="navbar">
    <h1>Pack 152 — Second-Hand Store</h1>
    <div class="nav-actions">
      <button class="btn-nav" type="button" onclick="openListingModal()">+ List an Item</button>
      <a href="/Platform/" class="btn-nav">← Back to Hub</a>
    </div>
  </header>

  <main class="container">
    <div id="listing-status" class="status-message" role="status"></div>
    <div id="listing-grid" class="listing-grid">
      <div class="empty-state">Loading listings...</div>
    </div>
  </main>

  <div id="listing-modal" class="modal-overlay">
    <div class="modal-card">
      <button class="item-detail-close" type="button" onclick="closeListingModal()" aria-label="Close listing form">×</button>
      <h2>List an Item</h2>
      <p>Add something another Pack 152 family might need.</p>
      <form id="listing-form">
        <div class="form-group">
          <label class="form-label" for="listing-name">Item name</label>
          <input id="listing-name" class="form-control" type="text" maxlength="120" required placeholder="e.g. Youth medium uniform shirt">
        </div>
        <div class="form-group">
          <label class="form-label" for="listing-price">Price (USD)</label>
          <input id="listing-price" class="form-control" type="number" min="0" step="0.01" inputmode="decimal" required value="0" placeholder="0.00">
          <div class="form-hint">Enter 0 if the item is free.</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="listing-description">Description</label>
          <textarea id="listing-description" class="form-control" rows="4" maxlength="2000" required placeholder="Condition, size, price or anything helpful..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="listing-photo">Photo</label>
          <input id="listing-photo" class="form-control" type="file" accept="image/*" required>
          <div class="form-hint">Images only, maximum 10 MB.</div>
        </div>
        <div class="contact-grid">
          <div class="form-group">
            <label class="form-label" for="listing-email">Contact email</label>
            <input id="listing-email" class="form-control" type="email" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="listing-phone">Contact phone</label>
            <input id="listing-phone" class="form-control" type="tel" required>
          </div>
        </div>
        <div id="form-status" class="status-message" role="alert"></div>
        <div class="form-actions">
          <button class="btn-back" type="button" onclick="closeListingModal()">Cancel</button>
          <button class="btn-action" type="submit">Publish Listing</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ygoxjtgoyoxjcvtypoii.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yfKBDqPQsdXY2dNhkuUPRw_7pea76ia';
    const BUCKET_NAME = 'SecondHandStore';
    const MAX_FILE_SIZE = 10 * 1024 * 1024;
    let supabaseClient;
    let currentUser;
    let listingToRemove;

    document.addEventListener('DOMContentLoaded', async () => {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return;
      currentUser = user;
      await loadProfileDefaults();
      await loadListings();
      document.getElementById('listing-form').addEventListener('submit', publishListing);
    });

    async function loadProfileDefaults() {
      const { data: profile } = await supabaseClient.from('profile').select('parent_name, phone_number').eq('id', currentUser.id).single();
      document.getElementById('listing-email').value = currentUser.email || '';
      document.getElementById('listing-phone').value = profile?.phone_number || '';
    }

    async function loadListings() {
      const grid = document.getElementById('listing-grid');
      const { data: listings, error } = await supabaseClient.from('SecondHandStore').select('*').eq('is_active', true).order('created_at', { ascending: false });
      if (error) {
        grid.innerHTML = '<div class="empty-state">Listings could not be loaded.</div>';
        setStatus(error.message);
        return;
      }
      if (!listings?.length) {
        grid.innerHTML = '<div class="empty-state">No items are listed yet. Be the first to share something.</div>';
        return;
      }

      const rendered = await Promise.all(listings.map(async listing => {
        const { data: signed } = await supabaseClient.storage.from(BUCKET_NAME).createSignedUrl(listing.photo_path, 3600);
        return { listing, imageUrl: signed?.signedUrl || '' };
      }));

      grid.innerHTML = rendered.map(({ listing, imageUrl }) => `
        <article class="item-card listing-card">
          <div class="listing-primary">
            ${imageUrl ? `<img class="item-image listing-image" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(listing.name)}" loading="lazy">` : '<div class="item-image listing-image"></div>'}
            <div class="item-heading listing-heading">
              <div class="item-title">${escapeHtml(listing.name)}</div>
            </div>
          </div>
          <div class="listing-details">
            <div class="item-price listing-price">${formatPrice(listing.price)}</div>
            <div class="item-desc listing-description">${escapeHtml(listing.description)}</div>
            <div class="listing-contact"><strong>Contact seller</strong><br>${escapeHtml(listing.contact_email)}<br>${escapeHtml(listing.contact_phone)}</div>
            ${listing.seller_id === currentUser.id ? `<div class="listing-owner-actions"><button class="btn-delete" type="button" onclick="openConfirmModal('${listing.id}', '${escapeHtml(listing.photo_path)}')">Mark as sold / remove</button></div>` : ''}
          </div>
        </article>
      `).join('');
    }

    async function publishListing(event) {
      event.preventDefault();
      setFormStatus('');
      const submitButton = event.target.querySelector('button[type="submit"]');
      const file = document.getElementById('listing-photo').files[0];
      if (!file || !file.type.startsWith('image/')) return setFormStatus('Please choose an image file.');
      if (file.size > MAX_FILE_SIZE) return setFormStatus('The image must be 10 MB or smaller.');

      submitButton.disabled = true;
      const extension = file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      const photoPath = `${currentUser.id}/${crypto.randomUUID()}.${extension}`;
      const { error: uploadError } = await supabaseClient.storage.from(BUCKET_NAME).upload(photoPath, file, { contentType: file.type, upsert: false });
      if (uploadError) {
        setFormStatus(uploadError.message);
        submitButton.disabled = false;
        return;
      }

      const { error: insertError } = await supabaseClient.from('SecondHandStore').insert({
        seller_id: currentUser.id,
        name: document.getElementById('listing-name').value.trim(),
        price: Number.parseFloat(document.getElementById('listing-price').value),
        description: document.getElementById('listing-description').value.trim(),
        photo_path: photoPath,
        contact_email: document.getElementById('listing-email').value.trim(),
        contact_phone: document.getElementById('listing-phone').value.trim()
      });
      if (insertError) {
        await supabaseClient.storage.from(BUCKET_NAME).remove([photoPath]);
        setFormStatus(insertError.message);
        submitButton.disabled = false;
        return;
      }

      event.target.reset();
      await loadProfileDefaults();
      closeListingModal();
      submitButton.disabled = false;
      await loadListings();
    }

    function openListingModal() { document.getElementById('listing-modal').style.display = 'flex'; }
    function closeListingModal() { document.getElementById('listing-modal').style.display = 'none'; setFormStatus(''); }
    async function openConfirmModal(id, photoPath) {
      if (!window.confirm('Remove this listing? It will no longer appear in the Second-Hand Store.')) return;
      const { error } = await supabaseClient.from('SecondHandStore').update({ is_active: false }).eq('id', id).eq('seller_id', currentUser.id);
      if (error) { setStatus(error.message); return; }
      await supabaseClient.storage.from(BUCKET_NAME).remove([photoPath]);
      await loadListings();
    }

    function setStatus(message) { document.getElementById('listing-status').textContent = message || ''; }
    function setFormStatus(message) { document.getElementById('form-status').textContent = message || ''; }
    function formatPrice(value) {
      const price = Number(value);
      return price === 0 ? 'Free' : `$${price.toFixed(2)}`;
    }
    function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[character]); }
  </script>
</body>
</html>
