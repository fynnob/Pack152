<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Orders — Pack 152</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth-guard.js"></script>
  <link rel="stylesheet" href="/shared.css?v=9">
  <style>
    :root {
      --primary: #16a34a;
      --secondary: #2563eb;
      --surface: rgba(30, 41, 59, 0.78);
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding-bottom: 4rem;
      color: #fff;
      background: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 2rem;
      background: rgba(30, 41, 59, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .navbar h1 { margin: 0; color: #60a5fa; font-size: 1.35rem; }
    .nav-actions { display: flex; gap: 0.75rem; align-items: center; }
    .btn-nav, .back-link {
      display: inline-flex;
      align-items: center;
      padding: 0.55rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.625rem;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
    }
    .page {
      max-width: 1100px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }
    .page-heading { margin-bottom: 1.5rem; }
    .page-heading h2 { margin: 0 0 0.35rem; font-size: 1.9rem; }
    .page-heading p { margin: 0; color: var(--muted); }
    #orders-list { display: grid; gap: 1.25rem; }
    .order-card {
      padding: 1.35rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      background: var(--surface);
    }
    .order-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .order-heading h3 { margin: 0 0 0.3rem; font-size: 1.05rem; }
    .order-meta { color: var(--muted); font-size: 0.82rem; }
    .delivered-badge {
      padding: 0.3rem 0.65rem;
      border: 1px solid #4ade80;
      border-radius: 999px;
      color: #86efac;
      background: rgba(22, 163, 74, 0.15);
      font-size: 0.75rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1rem;
    }
    .item-card {
      overflow: hidden;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.625rem;
      color: #fff;
      background: rgba(15, 23, 42, 0.7);
      text-align: left;
      cursor: pointer;
    }
    .item-card:hover { border-color: var(--secondary); }
    .item-card img { display: block; width: 100%; height: 145px; object-fit: cover; }
    .item-card-content { padding: 0.9rem; }
    .item-card h4 { margin: 0 0 0.45rem; font-size: 0.95rem; }
    .item-card p { margin: 0; color: var(--muted); font-size: 0.8rem; }
    .empty-state { padding: 2rem; border-radius: 1rem; color: var(--muted); background: var(--surface); text-align: center; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(15, 23, 42, 0.86);
      backdrop-filter: blur(8px);
    }
    .modal-card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(180px, 0.9fr) 1fr;
      gap: 1.5rem;
      width: min(720px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 1rem;
      background: #1e293b;
    }
    .modal-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 0.625rem; }
    .modal-card h2 { margin: 0 0 0.65rem; }
    .modal-card p { color: #cbd5e1; line-height: 1.5; }
    .detail-list { display: grid; gap: 0.55rem; margin-top: 1.2rem; color: #cbd5e1; font-size: 0.9rem; }
    .detail-list strong { color: #fff; }
    .close-button { position: absolute; top: 0.7rem; right: 0.7rem; border: 0; color: #fff; background: rgba(15, 23, 42, 0.75); font-size: 1.4rem; cursor: pointer; }
    @media (max-width: 680px) {
      .navbar { align-items: flex-start; flex-direction: column; padding: 1rem 1.25rem; }
      .nav-actions { width: 100%; justify-content: space-between; }
      .page { margin-top: 1.75rem; padding: 0 1rem; }
      .modal-card { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <h1>Pack 152 — Past Orders</h1>
    <div class="nav-actions">
      <a href="/Platform/Order/" class="btn-nav">Back to Orders</a>
      <a href="/Platform/" class="btn-nav">Back to Hub</a>
    </div>
  </header>

  <main class="page">
    <div class="page-heading">
      <h2>Past Orders</h2>
      <p>Delivered orders and the items included in each one.</p>
    </div>
    <div id="orders-list"><div class="empty-state">Loading past orders...</div></div>
  </main>

  <div id="item-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="item-title">
    <div class="modal-card">
      <button class="close-button" type="button" onclick="closeItemModal()" aria-label="Close item details">×</button>
      <img id="item-image" alt="">
      <div>
        <h2 id="item-title"></h2>
        <p id="item-description"></p>
        <div id="item-details" class="detail-list"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ygoxjtgoyoxjcvtypoii.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yfKBDqPQsdXY2dNhkuUPRw_7pea76ia';
    const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=800&q=80';
    let supabaseClient;
    let detailItems = [];

    document.addEventListener('DOMContentLoaded', loadPastOrders);

    async function loadPastOrders() {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { user } } = await supabaseClient.auth.getUser();
      const ordersList = document.getElementById('orders-list');
      if (!user) return;

      const [{ data: orders, error: ordersError }, { data: catalog, error: catalogError }] = await Promise.all([
        supabaseClient.from('orders').select('*').eq('user_id', user.id).eq('status', 'Delivered').order('created_at', { ascending: false }),
        supabaseClient.from('items').select('*')
      ]);

      if (ordersError || catalogError) {
        ordersList.innerHTML = '<div class="empty-state">Past orders could not be loaded.</div>';
        return;
      }
      if (!orders || orders.length === 0) {
        ordersList.innerHTML = '<div class="empty-state">You do not have any delivered orders yet.</div>';
        return;
      }

      const catalogById = Object.fromEntries((catalog || []).map(item => [String(item.id), item]));
      const catalogBySku = Object.fromEntries((catalog || []).filter(item => item.sku).map(item => [String(item.sku), item]));
      ordersList.innerHTML = orders.map((order, orderIndex) => {
        const items = (order.items || []).map(orderItem => {
          const catalogItem = catalogById[String(orderItem.id)] || catalogBySku[String(orderItem.sku)] || {};
          const item = { ...catalogItem, ...orderItem, image_url: orderItem.image_url || catalogItem.image_url || '', description: orderItem.description || catalogItem.description || '' };
          const itemIndex = detailItems.push(item) - 1;
          return `
            <button class="item-card" type="button" onclick="openItemModal(${itemIndex})">
              <img src="${escapeHtml(item.image_url || FALLBACK_IMAGE)}" alt="${escapeHtml(item.name || 'Order item')}" loading="lazy">
              <span class="item-card-content">
                <h4>${escapeHtml(item.name || 'Order item')}</h4>
                <p>${item.size ? `Size: ${escapeHtml(item.size)} · ` : ''}Quantity: ${Number(item.quantity) || 0}</p>
              </span>
            </button>
          `;
        }).join('');
        const orderDate = order.created_at ? new Date(order.created_at).toLocaleDateString() : 'Date unavailable';
        return `
          <section class="order-card">
            <div class="order-heading">
              <div>
                <h3>Order ${escapeHtml(order.reference_code || order.id.slice(0, 8))}</h3>
                <div class="order-meta">Delivered ${escapeHtml(orderDate)} · Total $${Number(order.total_amount || 0).toFixed(2)}</div>
              </div>
              <span class="delivered-badge">Delivered</span>
            </div>
            <div class="item-grid">${items || '<p class="order-meta">No item details available.</p>'}</div>
          </section>
        `;
      }).join('');
    }

    function openItemModal(itemIndex) {
      const item = detailItems[itemIndex];
      if (!item) return;
      document.getElementById('item-image').src = item.image_url || FALLBACK_IMAGE;
      document.getElementById('item-image').alt = item.name || 'Order item';
      document.getElementById('item-title').textContent = item.name || 'Order item';
      document.getElementById('item-description').textContent = item.description || 'No description was saved for this item.';
      document.getElementById('item-details').innerHTML = `
        <div><strong>Size:</strong> ${escapeHtml(item.size || 'One size')}</div>
        <div><strong>SKU:</strong> ${escapeHtml(item.sku || 'N/A')}</div>
        <div><strong>Quantity:</strong> ${Number(item.quantity) || 0}</div>
        <div><strong>Price:</strong> $${Number(item.price || 0).toFixed(2)}</div>
      `;
      document.getElementById('item-modal').style.display = 'flex';
    }

    function closeItemModal() { document.getElementById('item-modal').style.display = 'none'; }
    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
    }
  </script>
</body>
</html>
